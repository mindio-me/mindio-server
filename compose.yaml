services:
  mysql:
    image: mysql:8.0
    container_name: mindio-app-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mindio_app
      MYSQL_USER: mindio
      MYSQL_PASSWORD: mindio123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql-data:
